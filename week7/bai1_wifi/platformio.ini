[platformio]
default_envs = sta_wokwi

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200

[env:ap]
build_flags = -DWIFI_AP_MODE

[env:sta]
build_flags = -DWIFI_STA_MODE

[env:sta_wokwi]
build_flags = -DWIFI_STA_MODE -DWOKWI_SIMULATION
