[platformio]
default_envs = classic_ap, classic_sta

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200

[env:classic_ap]
board = esp32dev
build_src_filter = +<ap/main.cpp>

[env:classic_sta]
board = esp32dev
build_src_filter = +<sta/main.cpp>

[env:emu_ap]
board = esp32-s3-devkitc-1
board_build.flash_mode = qio
board_build.f_flash = 80000000L
build_src_filter = +<ap/main.cpp>

[env:emu_sta]
board = esp32-s3-devkitc-1
board_build.flash_mode = qio
board_build.f_flash = 80000000L
build_src_filter = +<sta/main.cpp>

[env:emu_apsta]
board = esp32-s3-devkitc-1
board_build.flash_mode = qio
board_build.f_flash = 80000000L
build_src_filter = +<apsta/main.cpp>

[env:breadboard_sta]
board = esp32dev
build_src_filter = +<sta/main.cpp>
build_flags = -D BREADBOARD_SIM
